name: Build device tools bundle

# Sklapa Windows x64 bundle alata (libimobiledevice + idevicerestore) iz MSYS2
# paketa i objavljuje ga na STALNI "tools-latest" release kao
# "ultraidevice-tools-win-x64.zip". Aplikacija (Tools > Install device tools)
# preuzima BAŠ taj fajl, pa posle prvog uspešnog pokretanja ovog workflow-a
# auto-instalacija radi za sve korisnike, bez ičega ručnog.
#
# Pokreće se sam na svaki push na main, ili ručno
# (Actions > Build device tools bundle > Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          # UCRT64 je novi preporučeni MSYS2 environment (MINGW64 je deprecated).
          msystem: UCRT64
          update: true
          # Samo idevicerestore — pacman sam povuče sve zavisnosti
          # (libimobiledevice sa alatima idevice_id/ideviceinfo/idevicebackup2/
          #  ideviceenterrecovery, pa libirecovery sa irecovery, libplist...).
          install: >-
            zip
            mingw-w64-ucrt-x86_64-idevicerestore

      - name: Collect binaries and their DLL dependencies
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p bundle
          # $MINGW_PREFIX je /ucrt64 u ovom okruženju (ili /mingw64 u starom).
          TOOLS="idevice_id ideviceinfo idevicerestore irecovery ideviceenterrecovery idevicebackup2"
          for t in $TOOLS; do
            p="$MINGW_PREFIX/bin/$t.exe"
            if [ -f "$p" ]; then
              cp "$p" bundle/
              # ldd daje pune putanje zavisnih DLL-ova; uzmemo one iz MSYS2 prefiksa.
              ldd "$p" | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' | sort -u \
                | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/ || true; done
            else
              echo "MISSING TOOL: $t"
            fi
          done
          echo "---- bundle contents ----"
          ls -la bundle

      - name: Zip bundle
        shell: msys2 {0}
        run: |
          cd bundle
          zip -r ../ultraidevice-tools-win-x64.zip .

      - name: Publish to the tools-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          # Napravi "tools-latest" release ako ne postoji, pa zakači/osveži zip.
          gh release view tools-latest --repo "$R" >/dev/null 2>&1 \
            || gh release create tools-latest --repo "$R" --prerelease \
                 --title "Device tools (auto-built)" \
                 --notes "Auto-built libimobiledevice + idevicerestore Windows x64 bundle. Downloaded by the app's Tools > Install device tools."
          gh release upload tools-latest ultraidevice-tools-win-x64.zip --clobber --repo "$R"
