name: Build device tools bundle

# Sklapa Windows x64 bundle alata (libimobiledevice + idevicerestore) iz MSYS2
# paketa i objavljuje ga na STALNI "tools-latest" release kao
# "ultraidevice-tools-win-x64.zip". Aplikacija (Tools > Install device tools)
# preuzima BAŠ taj fajl, pa posle prvog uspešnog pokretanja ovog workflow-a
# auto-instalacija radi za sve korisnike, bez ičega ručnog.
#
# Pokreće se sam na svaki push na main, ili ručno
# (Actions > Build device tools bundle > Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip

      - name: Install device tools from MSYS2
        shell: msys2 {0}
        run: |
          # Eksplicitno, sa vidljivim ishodom. idevicerestore povuče libimobiledevice
          # (idevice_id/ideviceinfo/idevicebackup2/ideviceenterrecovery), libirecovery
          # (irecovery), libtatsu, libplist...
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-libimobiledevice \
            mingw-w64-ucrt-x86_64-libirecovery \
            mingw-w64-ucrt-x86_64-idevicerestore

      - name: Collect binaries and their DLL dependencies
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p bundle

          # ── Dijagnostika u bundle (da se tačno vidi šta je instalirano) ──
          {
            echo "== MINGW_PREFIX = $MINGW_PREFIX =="
            echo "== pacman -Q (relevantno) =="
            pacman -Q 2>/dev/null | grep -Ei 'idevice|imobile|irecovery|tatsu|plist|usbmuxd' || echo "(nista)"
            echo "== find idevicerestore.exe =="
            find / -name 'idevicerestore.exe' 2>/dev/null || echo "(nije nadjeno)"
            echo "== ls prefix/bin idevice* irecovery* =="
            ls -la "$MINGW_PREFIX/bin"/idevice* "$MINGW_PREFIX/bin"/irecovery* 2>/dev/null || true
          } > bundle/build-info.txt

          # ── Kopiraj alate (sa potragom ako nisu na očekivanom mestu) ──
          TOOLS="idevice_id ideviceinfo idevicerestore irecovery ideviceenterrecovery idevicebackup2"
          for t in $TOOLS; do
            p="$MINGW_PREFIX/bin/$t.exe"
            if [ ! -f "$p" ]; then
              p="$(find / -name "$t.exe" 2>/dev/null | head -n 1)"
            fi
            if [ -n "$p" ] && [ -f "$p" ]; then
              cp "$p" bundle/
              ldd "$p" | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' | sort -u \
                | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/ || true; done
            else
              echo "MISSING TOOL: $t" | tee -a bundle/build-info.txt
            fi
          done
          echo "---- bundle contents ----"
          ls -la bundle

      - name: Zip bundle
        shell: msys2 {0}
        run: |
          cd bundle
          zip -r ../ultraidevice-tools-win-x64.zip .

      - name: Publish to the tools-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh release view tools-latest --repo "$R" >/dev/null 2>&1 \
            || gh release create tools-latest --repo "$R" --prerelease \
                 --title "Device tools (auto-built)" \
                 --notes "Auto-built libimobiledevice + idevicerestore Windows x64 bundle. Downloaded by the app's Tools > Install device tools."
          gh release upload tools-latest ultraidevice-tools-win-x64.zip --clobber --repo "$R"
