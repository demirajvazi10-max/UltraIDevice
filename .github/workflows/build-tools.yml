name: Build device tools bundle

# Sklapa Windows x64 bundle alata (libimobiledevice + idevicerestore) iz MSYS2
# paketa i objavljuje ga na STALNI "tools-latest" release kao
# "ultraidevice-tools-win-x64.zip". Aplikacija (Tools > Install device tools)
# preuzima BAŠ taj fajl.
#
# Ova verzija je otporna na greške: instalacija paketa NE ruši build (svaki
# paket zasebno, uz log), i u bundle UVEK ide build-info.txt sa dijagnostikom,
# pa se tačno vidi šta je instalirano i gde je idevicerestore.exe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip

      - name: Build bundle (install + collect, never fails)
        shell: msys2 {0}
        run: |
          # MSYS2 ljuska na Actions-u ume da uključi set -e / pipefail, pa bi jedna
          # cevovod-komanda koja vrati ne-nulu oborila ceo korak. Isključujemo to,
          # da korak UVEK napravi i okači bundle sa build-info.txt.
          set +e
          set +o pipefail
          mkdir -p bundle
          LOG=bundle/build-info.txt
          echo "== MINGW_PREFIX = $MINGW_PREFIX ==" > "$LOG"

          echo "== install ==" >> "$LOG"
          for pkg in \
            mingw-w64-ucrt-x86_64-libimobiledevice \
            mingw-w64-ucrt-x86_64-libirecovery \
            mingw-w64-ucrt-x86_64-idevicerestore ; do
            echo "-- $pkg --" >> "$LOG"
            pacman -S --needed --noconfirm "$pkg" >> "$LOG" 2>&1 || echo "FAILED: $pkg" >> "$LOG"
          done

          echo "== pacman -Q (relevantno) ==" >> "$LOG"
          pacman -Q 2>/dev/null | grep -Ei 'idevice|imobile|irecovery|tatsu|plist|usbmuxd' >> "$LOG" || echo "(nista)" >> "$LOG"
          echo "== find idevicerestore.exe ==" >> "$LOG"
          find / -name 'idevicerestore.exe' 2>/dev/null >> "$LOG" || echo "(nije nadjeno)" >> "$LOG"
          echo "== ls prefix/bin ==" >> "$LOG"
          ls -la "$MINGW_PREFIX/bin"/idevice* "$MINGW_PREFIX/bin"/irecovery* >> "$LOG" 2>&1 || true

          echo "== collect ==" >> "$LOG"
          TOOLS="idevice_id ideviceinfo idevicerestore irecovery ideviceenterrecovery idevicebackup2"
          for t in $TOOLS; do
            p="$MINGW_PREFIX/bin/$t.exe"
            [ -f "$p" ] || p="$(find / -name "$t.exe" 2>/dev/null | head -n 1)"
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "OK $t -> $p" >> "$LOG"
              cp "$p" bundle/
              { ldd "$p" | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' | sort -u \
                | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/; done ; } || true
            else
              echo "MISSING $t" >> "$LOG"
            fi
          done
          echo "---- bundle contents ----"
          ls -la bundle

      - name: Zip bundle
        shell: msys2 {0}
        run: |
          cd bundle
          zip -r ../ultraidevice-tools-win-x64.zip .

      - name: Publish to the tools-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh release view tools-latest --repo "$R" >/dev/null 2>&1 \
            || gh release create tools-latest --repo "$R" --prerelease \
                 --title "Device tools (auto-built)" \
                 --notes "Auto-built libimobiledevice + idevicerestore Windows x64 bundle. Downloaded by the app's Tools > Install device tools."
          gh release upload tools-latest ultraidevice-tools-win-x64.zip --clobber --repo "$R"
