name: Build device tools bundle

# Sklapa Windows x64 bundle alata (libimobiledevice + idevicerestore) iz MSYS2
# paketa i objavljuje ga na STALNI "tools-latest" release kao
# "ultraidevice-tools-win-x64.zip". Aplikacija (Tools > Install device tools)
# preuzima BAŠ taj fajl.
#
# NAPOMENA: UCRT64 varijanta paketa idevicerestore instalira zavisnosti ali NE
# isporuči idevicerestore.exe (potvrđeno dijagnostikom). Zato koristimo MINGW64
# okruženje. Ono je "deprecated" (samo upozorenje), ali ima kompletan paket.
# Korak se ne ruši na grešku i uvek objavi bundle sa build-info.txt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Potisni upozorenje da je MINGW64 deprecated (svesno ga koristimo).
          msystem-mingw64-suppress-deprecation-warning: true
          install: >-
            zip

      - name: Build bundle (install + collect, never fails)
        shell: msys2 {0}
        run: |
          set +e
          set +o pipefail
          mkdir -p bundle
          LOG=bundle/build-info.txt
          echo "== MINGW_PREFIX = $MINGW_PREFIX ==" > "$LOG"

          echo "== install ==" >> "$LOG"
          for pkg in \
            mingw-w64-x86_64-libimobiledevice \
            mingw-w64-x86_64-libirecovery \
            mingw-w64-x86_64-idevicerestore ; do
            echo "-- $pkg --" >> "$LOG"
            pacman -S --needed --noconfirm "$pkg" >> "$LOG" 2>&1 || echo "FAILED: $pkg" >> "$LOG"
          done

          echo "== pacman -Ql idevicerestore (exe) ==" >> "$LOG"
          pacman -Ql mingw-w64-x86_64-idevicerestore 2>/dev/null | grep -i '\.exe' >> "$LOG" || echo "(nema exe u paketu)" >> "$LOG"
          echo "== find idevicerestore(.exe) svuda ==" >> "$LOG"
          find / -iname 'idevicerestore*' 2>/dev/null >> "$LOG" || echo "(nije nadjeno)" >> "$LOG"
          echo "== ls prefix/bin ==" >> "$LOG"
          ls -la "$MINGW_PREFIX/bin"/idevice* "$MINGW_PREFIX/bin"/irecovery* >> "$LOG" 2>&1 || true

          echo "== collect ==" >> "$LOG"
          TOOLS="idevice_id ideviceinfo idevicerestore irecovery ideviceenterrecovery idevicebackup2"
          for t in $TOOLS; do
            p="$MINGW_PREFIX/bin/$t.exe"
            [ -f "$p" ] || p="$(find / -name "$t.exe" 2>/dev/null | head -n 1)"
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "OK $t -> $p" >> "$LOG"
              cp "$p" bundle/
              { ldd "$p" | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' | sort -u \
                | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/; done ; } || true
            else
              echo "MISSING $t" >> "$LOG"
            fi
          done
          echo "---- bundle contents ----"
          ls -la bundle

      - name: Zip bundle
        shell: msys2 {0}
        run: |
          cd bundle
          zip -r ../ultraidevice-tools-win-x64.zip .

      - name: Publish to the tools-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh release view tools-latest --repo "$R" >/dev/null 2>&1 \
            || gh release create tools-latest --repo "$R" --prerelease \
                 --title "Device tools (auto-built)" \
                 --notes "Auto-built libimobiledevice + idevicerestore Windows x64 bundle. Downloaded by the app's Tools > Install device tools."
          gh release upload tools-latest ultraidevice-tools-win-x64.zip --clobber --repo "$R"
