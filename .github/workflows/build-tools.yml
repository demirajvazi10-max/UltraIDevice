name: Build device tools bundle

# Sklapa Windows x64 bundle alata (libimobiledevice + idevicerestore) i objavljuje
# ga na STALNI "tools-latest" release kao "ultraidevice-tools-win-x64.zip".
# Aplikacija (Tools > Install device tools) preuzima BAŠ taj fajl.
#
# ZAŠTO BUILD IZ IZVORA (a ne pacman paketi):
#   MSYS2 pacman isporučuje ZASTAREO idevicerestore (bez libtatsu) koji za
#   iOS 26/27 šalje pogrešan TSS zahtev -> Apple vraća STATUS=94 i erase padne
#   na "Unable to get SHSH blobs", a update padne na "preboard manifest".
#   Zato gradimo CEO lanac iz zvaničnog git master-a, uključujući libtatsu
#   (biblioteka koja sastavlja TSS zahtev), pa uvek imamo najnoviji kod sa
#   podrškom za aktuelni iOS.
#
# Redosled build-a je bitan (svaki zavisi od prethodnih):
#   libplist -> libimobiledevice-glue -> libtatsu -> libusbmuxd
#            -> libimobiledevice -> libirecovery -> idevicerestore
#
# Korak se ne ruši na grešku i UVEK objavi bundle sa build-info.txt (dijagnostika).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            make
            pkgconf
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libxml2

      - name: Build from git master (never fails the step)
        shell: msys2 {0}
        run: |
          set +e
          set +o pipefail
          mkdir -p bundle src
          # APSOLUTNA putanja — build se radi unutar "cd src/<projekat>",
          # pa relativna putanja do loga tamo ne bi postojala (i preusmeravanje
          # izlaza bi puklo pre nego što build uopšte krene).
          LOG="$(pwd)/bundle/build-info.txt"
          echo "== MINGW_PREFIX = $MINGW_PREFIX ==" > "$LOG"
          echo "== built from libimobiledevice git master ==" >> "$LOG"
          date >> "$LOG"

          # Gradi jedan projekat iz git master-a i instalira ga u $MINGW_PREFIX
          # (tako ga sledeći projekti nalaze preko pkg-config).
          build_one() {
            name="$1"; shift
            echo "==================== build $name ====================" >> "$LOG"
            rm -rf "src/$name"
            git clone --depth 1 "https://github.com/libimobiledevice/$name" "src/$name" >> "$LOG" 2>&1 \
              || { echo "CLONE FAILED: $name" >> "$LOG"; return 1; }
            ( cd "src/$name" \
                && ./autogen.sh --prefix="$MINGW_PREFIX" "$@" >> "$LOG" 2>&1 \
                && make -j"$(nproc)" >> "$LOG" 2>&1 \
                && make install >> "$LOG" 2>&1 ) \
              || { echo "BUILD FAILED: $name" >> "$LOG"; return 1; }
            # zabeleži verziju (git opis) radi dijagnostike
            echo -n "version $name = " >> "$LOG"
            ( cd "src/$name" && git describe --tags --always 2>/dev/null ) >> "$LOG" 2>&1 || echo "?" >> "$LOG"
            echo "OK: $name" >> "$LOG"
          }

          build_one libplist               --without-cython
          build_one libimobiledevice-glue
          build_one libtatsu
          build_one libusbmuxd
          build_one libimobiledevice       --without-cython
          build_one libirecovery
          build_one idevicerestore
          build_one ideviceinstaller      # upravljanje aplikacijama (.ipa install/uninstall/list)
          build_one ideviceactivation     # aktivacija uređaja posle restore-a (treba libxml2)

          # ── Mali custom alat: ideviceaccessibility ──────────────────────────
          # Postavlja prekidače pristupačnosti preko lockdown domena
          # com.apple.Accessibility (isto što je stari iTunes radio kroz
          # "Configure Accessibility"). Ključ za VoiceOver: VoiceOverTouchEnabledByiTunes.
          # Upotreba: ideviceaccessibility -u UDID on|off [-k Kljuc]
          echo "==================== build ideviceaccessibility ====================" >> "$LOG"
          cat > uaccess.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <libimobiledevice/libimobiledevice.h>
          #include <libimobiledevice/lockdown.h>
          #include <plist/plist.h>

          int main(int argc, char **argv) {
              const char *udid = NULL;
              const char *key  = "VoiceOverTouchEnabledByiTunes";
              int onoff = 1;
              for (int i = 1; i < argc; i++) {
                  if (!strcmp(argv[i], "-u") && i + 1 < argc) udid = argv[++i];
                  else if (!strcmp(argv[i], "-k") && i + 1 < argc) key = argv[++i];
                  else if (!strcmp(argv[i], "on"))  onoff = 1;
                  else if (!strcmp(argv[i], "off")) onoff = 0;
              }
              idevice_t dev = NULL;
              if (idevice_new_with_options(&dev, udid,
                      IDEVICE_LOOKUP_USBMUX | IDEVICE_LOOKUP_NETWORK) != IDEVICE_E_SUCCESS || !dev) {
                  fprintf(stderr, "ERROR: device not found\n");
                  return 2;
              }
              lockdownd_client_t cli = NULL;
              if (lockdownd_client_new_with_handshake(dev, &cli, "UltraIDevice") != LOCKDOWN_E_SUCCESS) {
                  fprintf(stderr, "ERROR: lockdown handshake failed (device may need Trust/pairing)\n");
                  idevice_free(dev);
                  return 3;
              }
              plist_t val = plist_new_bool(onoff);
              lockdownd_error_t e = lockdownd_set_value(cli, "com.apple.Accessibility", key, val);
              plist_free(val);
              lockdownd_client_free(cli);
              idevice_free(dev);
              if (e != LOCKDOWN_E_SUCCESS) {
                  fprintf(stderr, "ERROR: set_value failed (%d)\n", (int)e);
                  return 4;
              }
              printf("OK: %s = %d\n", key, onoff);
              return 0;
          }
          EOF
          # YAML blok ima uvlačenje; skini vodeće razmake pre kompajliranja.
          sed -i 's/^          //' uaccess.c
          if gcc -O2 uaccess.c -o bundle/ideviceaccessibility.exe \
                $(pkg-config --cflags --libs libimobiledevice-1.0 libplist-2.0) >> "$LOG" 2>&1; then
              echo "OK: ideviceaccessibility" >> "$LOG"
              { ldd bundle/ideviceaccessibility.exe | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' \
                | sort -u | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/; done ; } || true
          else
              echo "BUILD FAILED: ideviceaccessibility" >> "$LOG"
          fi

          echo "==================== collect ====================" >> "$LOG"
          # Kad se gradi iz izvora, imena su kanonska (idevicerestore.exe itd.),
          # ali zadržavamo i fallback pretragu za svaki slučaj.
          # 6 osnovnih + idevicediagnostics (zdravlje baterije) + idevicepair (Trust).
          TOOLS="idevice_id ideviceinfo idevicerestore irecovery ideviceenterrecovery idevicebackup2 idevicediagnostics idevicepair idevicename afcclient ideviceinstaller idevicesyslog idevicecrashreport ideviceactivation"
          for t in $TOOLS; do
            p="$MINGW_PREFIX/bin/$t.exe"
            [ -f "$p" ] || p="$(find "$MINGW_PREFIX/bin" -iname "*$t.exe" 2>/dev/null | head -n 1)"
            [ -f "$p" ] || p="$(find / -iname "*$t.exe" 2>/dev/null | head -n 1)"
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "OK $t -> $p" >> "$LOG"
              cp "$p" "bundle/$t.exe"
              # povuci sve DLL zavisnosti iz prefiksa (uključujući libtatsu,
              # sveže izgrađene libimobiledevice/libirecovery itd.)
              { ldd "$p" | awk -v pfx="$MINGW_PREFIX" '/=>/ && $3 ~ pfx {print $3}' | sort -u \
                | while read -r d; do [ -f "$d" ] && cp -u "$d" bundle/; done ; } || true
            else
              echo "MISSING $t" >> "$LOG"
            fi
          done

          echo "== libtatsu prisutan? ==" >> "$LOG"
          ls -la bundle/ | grep -i tatsu >> "$LOG" || echo "(NEMA libtatsu u bundle-u!)" >> "$LOG"
          echo "---- bundle contents ----"
          ls -la bundle

      - name: Zip bundle
        shell: msys2 {0}
        run: |
          cd bundle
          zip -r ../ultraidevice-tools-win-x64.zip .

      - name: Publish to the tools-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh release view tools-latest --repo "$R" >/dev/null 2>&1 \
            || gh release create tools-latest --repo "$R" --prerelease \
                 --title "Device tools (auto-built)" \
                 --notes "Auto-built libimobiledevice + idevicerestore Windows x64 bundle (from git master, includes libtatsu). Downloaded by the app's Tools > Install device tools."
          gh release upload tools-latest ultraidevice-tools-win-x64.zip --clobber --repo "$R"

      - name: Verify bundle is complete (fails the run if not)
        shell: msys2 {0}
        run: |
          # Tek sada rušimo run ako nešto ključno fali — bundle + build-info.txt
          # su već objavljeni gore, pa dijagnostika postoji i kad ovo padne.
          missing=0
          for f in idevicerestore.exe idevice_id.exe ideviceinfo.exe irecovery.exe; do
            if [ ! -f "bundle/$f" ]; then echo "MISSING: bundle/$f"; missing=1; fi
          done
          if ! ls bundle/ | grep -qi tatsu; then echo "MISSING: libtatsu DLL"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Bundle je nepotpun — pogledaj build-info.txt u tools-latest release-u."
            exit 1
          fi
          echo "Bundle OK: idevicerestore + libtatsu prisutni."
